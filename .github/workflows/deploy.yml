name: Deploy resume to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write # This grants permission to write files/contents back to the repository.

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      # This is the critical line that grants write access to Pages
      pages: write

      # This is also required for the deploy-pages action
      id-token: write

      # Recommended to also include 'contents: read' for checkout
      contents: read

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      # Deploy to GitHub pages
      - name: Deploy to GitHub pages
        env:
          GH_PAT: ${{ secrets.GH_PAT }}   # make sure this secret exists in repo settings
        run: |
          PUBLISH_DIR=dist

          # configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # prepare a new repo in the publish directory
          cd "$PUBLISH_DIR"
          git init
          git add -A
          git commit -m "Deploy from GitHub Actions" || echo "No changes to commit"

          # set branch and push using the PAT (force to overwrite gh-pages)
          git branch -M gh-pages
          git remote add origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git
          git push -f origin gh-pages
